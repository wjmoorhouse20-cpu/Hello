<style>
/* Layout: iOS grouped-list app — large-title header, white rounded cards on grey, floating frosted tab bar */
:root{--bg:#F2F2F7;--card:#FFFFFF;--fg:#000000;--fg2:rgba(60,60,67,.62);--sep:rgba(60,60,67,.16);--fill:rgba(118,118,128,.12);--bar:rgba(250,250,252,.74);--shadow:0 8px 30px rgba(0,0,0,.10);
--m:#007AFF;--p:#5856D6;--e:#0E9AA7;--t:#FF8A00;--red:#FF3B30;--amber:#FF9F0A;--green:#34C759;--ac:var(--m);--ff:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;--fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--card:#1C1C1E;--fg:#FFFFFF;--fg2:rgba(235,235,245,.6);--sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.26);--bar:rgba(28,28,30,.72);--shadow:0 8px 30px rgba(0,0,0,.6);--m:#0A84FF;--p:#7D7AFF;--e:#3CC8D2;--t:#FF9F0A;--red:#FF453A;--amber:#FFB340;--green:#30D158;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--card:#1C1C1E;--fg:#FFFFFF;--fg2:rgba(235,235,245,.6);--sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.26);--bar:rgba(28,28,30,.72);--shadow:0 8px 30px rgba(0,0,0,.6);--m:#0A84FF;--p:#7D7AFF;--e:#3CC8D2;--t:#FF9F0A;--red:#FF453A;--amber:#FFB340;--green:#30D158;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.38 var(--ff);margin:0;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(120px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.eye{color:var(--ac);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tb{display:flex;gap:6px}
.tbtn{min-height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-size:15px;font-weight:600;color:var(--ac)}
.tbtn.on{background:var(--ac);color:#fff}
h1{font:800 34px/1.1 var(--fd);letter-spacing:-.02em;margin:2px 0 14px;text-wrap:balance}
.card{background:var(--card);border-radius:16px;overflow:hidden}
.stack{display:grid;gap:12px}
.rings{display:flex;align-items:center;gap:18px;padding:16px}
.ring{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.ring svg{flex:none}
.ring b{display:block;font-size:15px}.ring small{color:var(--fg2);font-size:13px}
.rtrack{stroke:var(--fill)}.rval{stroke:var(--ac);transition:stroke-dashoffset .5s}
.rpct{fill:var(--fg);font:700 15px var(--ff)}
.rnote .rval{stroke:var(--green)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;min-height:52px;border-top:.5px solid var(--sep)}
.row label{flex:1 0 auto;font-weight:600;white-space:nowrap}
.row input[type=date]{background:var(--fill);border:0;border-radius:9px;padding:7px 10px;min-height:36px}
.days{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--fg2);font-size:14px;white-space:nowrap}
.days b{color:var(--ac);font-size:20px}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 12px;min-height:44px}
.search input{flex:1;border:0;background:none;min-width:0;outline:0;min-height:44px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{flex:1;min-height:36px;border-radius:8px;font-size:14px;font-weight:600;color:var(--fg2)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.grp{font:700 20px var(--fd);margin:14px 4px 2px;letter-spacing:-.01em}
.grp small{display:block;color:var(--ac);font:700 12px var(--ff);letter-spacing:.06em;text-transform:uppercase}
.sh{display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;min-height:58px}
.sh.sub{min-height:50px;border-top:.5px solid var(--sep);padding-left:22px}
.sh .tt{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:8px;min-height:inherit;font-weight:650}
.sh.sub .tt{font-weight:550;font-size:15px}
.chev{flex:none;width:9px;height:9px;border-right:2.4px solid var(--fg2);border-bottom:2.4px solid var(--fg2);transform:rotate(-45deg);transition:transform .2s;margin-right:4px}
.open>.sh .chev,.sh.open .chev{transform:rotate(45deg)}
.cnt{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt.full{color:var(--green);font-weight:700}
.ib{flex:none;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--ac);font-size:24px;font-weight:400;line-height:1}
.ib:active{background:var(--fill)}
.ib.del{color:var(--red);font-size:15px;font-weight:600;width:auto;padding:0 8px}
.ib.arm{background:var(--red);color:#fff}
.pts{border-top:.5px solid var(--sep)}
.pt{padding:10px 8px 12px 22px;border-top:.5px solid var(--sep)}
.pt:first-child{border-top:0}
.pr{display:flex;align-items:flex-start;gap:10px}
.ptx{flex:1;min-width:0;padding-top:10px;font-size:15px}
.ref{font-weight:700;color:var(--ac);margin-right:5px;font-variant-numeric:tabular-nums}
.done .ptx{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--fg2)}
.done .tt>span:first-of-type{text-decoration:line-through;color:var(--fg2)}
.dot{flex:none;width:44px;height:44px;display:grid;place-items:center}
.dot i{width:20px;height:20px;border-radius:10px;border:2px solid var(--fg2);display:block}
.dot.c1 i{background:var(--red);border-color:var(--red)}.dot.c2 i{background:var(--amber);border-color:var(--amber)}.dot.c3 i{background:var(--green);border-color:var(--green)}
.ib.added{color:#fff;background:var(--ac);font-size:18px}
.pb{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0 54px}
.pill{min-height:36px;padding:0 13px;border-radius:18px;background:var(--fill);font-size:14px;font-weight:600;color:var(--fg2)}
.pill.on{background:var(--ac);color:#fff}
.pill.on.rd{background:var(--green)}
.ed{flex:1;min-width:0;border:0;border-radius:9px;background:var(--fill);padding:8px 10px;min-height:40px}
.add{display:flex;gap:8px;padding:10px 12px 10px 22px;border-top:.5px solid var(--sep)}
.add input{flex:1}
.abtn{min-height:40px;padding:0 14px;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;font-size:15px}
.abtn.g{background:var(--fill);color:var(--ac)}
.abtn.r{background:var(--fill);color:var(--red)}
.abtn.r.arm{background:var(--red);color:#fff}
.empty{padding:28px 18px;text-align:center;color:var(--fg2)}
.tk{display:flex;align-items:center;gap:6px;padding:0 6px 0 8px;min-height:52px;border-top:.5px solid var(--sep)}
.tk:first-child{border-top:0}
.ck{flex:none;width:44px;height:44px;display:grid;place-items:center}
.ck i{width:24px;height:24px;border-radius:12px;border:2px solid var(--fg2);display:grid;place-items:center;color:#fff;font-size:14px;font-style:normal;font-weight:800}
.tk.d .ck i{background:var(--ac);border-color:var(--ac)}
.tk span{flex:1;min-width:0;font-size:15px;padding:8px 0}
.tk.d span{text-decoration:line-through;color:var(--fg2)}
.tk .x{width:40px;height:40px;color:var(--fg2);font-size:20px}
.lbl{font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;margin:8px 16px 0}
.foot{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.sync{font-size:13px;color:var(--fg2);padding:0 16px 14px}
.sync i{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--fg2);margin-right:6px}
.sync.ok i{background:var(--green)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:6px;border-radius:30px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:var(--shadow);border:.5px solid var(--sep);z-index:20;width:min(420px,calc(100% - 24px))}
nav button{flex:1;display:grid;justify-items:center;gap:1px;min-height:54px;padding:6px 0 4px;border-radius:24px;color:var(--fg2);font-size:11px;font-weight:600}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--c);background:var(--fill)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;align-items:end;z-index:40;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet .card{max-width:600px;width:100%;margin:0 auto;padding:16px;display:grid;gap:12px}
.sheet h2{margin:0;font:700 20px var(--fd)}
.sheet p{margin:0;color:var(--fg2);font-size:14px}
.sheet textarea{width:100%;min-height:160px;border:0;border-radius:12px;background:var(--fill);padding:12px;font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
.sheet .foot{padding:0;justify-content:flex-end}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script type="text/plain" id="d-m">
@Year 1|AS content
#Pure
##1 Proof
1.1 Proof by deduction, proof by exhaustion and disproof by counter-example
##2 Algebra and functions
2.1 Laws of indices for all rational exponents
2.2 Surds, including rationalising the denominator
2.3 Quadratics: graphs, discriminant, completing the square and solving (including in a function of the unknown)
2.4 Simultaneous equations by elimination and substitution, including one linear and one quadratic
2.5 Linear and quadratic inequalities, set notation, and representing inequalities graphically
2.6 Polynomials: expanding, factorising, simple algebraic division and the factor theorem
2.7 Graphs of functions: polynomials, y = a/x and y = a/x² with asymptotes; solving equations graphically; proportional relationships
2.9 Transformations y = af(x), y = f(x) + a, y = f(x + a), y = f(ax)
##3 Coordinate geometry in the (x, y) plane
3.1 Straight lines: y − y₁ = m(x − x₁) and ax + by + c = 0; parallel and perpendicular gradients; straight-line models
3.2 Circles: (x − a)² + (y − b)² = r², completing the square for centre and radius; angle in a semicircle, perpendicular to a chord, tangent ⟂ radius
##4 Sequences and series
4.1 Binomial expansion of (a + bx)ⁿ for positive integer n; n! and ⁿCᵣ; link to binomial probabilities
##5 Trigonometry
5.1 Sine, cosine and tangent for all arguments; sine and cosine rules; area = ½ab sin C
5.3 Graphs of sin, cos and tan: symmetries and periodicity
5.5 tan θ = sin θ / cos θ and sin²θ + cos²θ = 1
5.7 Solve trig equations in a given interval, including quadratics and multiples of the angle
##6 Exponentials and logarithms
6.1 The functions aˣ and eˣ and their graphs
6.2 Gradient of e^kx is ke^kx; why exponential models suit many applications
6.3 logₐx as the inverse of aˣ; ln x as the inverse of eˣ
6.4 Laws of logarithms
6.5 Solve equations of the form aˣ = b
6.6 Log graphs to estimate parameters in y = axⁿ and y = kbˣ
6.7 Exponential growth and decay in modelling; limitations and refinements
##7 Differentiation
7.1 Derivative as gradient of the tangent and as a limit; rate of change; sketching gradient functions; second derivatives; first principles for small positive integer powers
7.2 Differentiate xⁿ for rational n, with constant multiples, sums and differences
7.3 Gradients, tangents, normals, maxima, minima and stationary points; increasing and decreasing functions
##8 Integration
8.1 The Fundamental Theorem of Calculus
8.2 Integrate xⁿ (n ≠ −1) with sums, differences and constant multiples
8.3 Definite integrals; area under a curve
##10 Vectors
10.1 Vectors in two dimensions
10.2 Magnitude and direction; component and magnitude–direction forms
10.3 Adding vectors, multiplying by scalars and their geometric meaning
10.4 Position vectors; distance between two points
10.5 Vectors in pure maths and in context, including forces
#Statistics
##1 Statistical sampling
1.1 Population and sample; informal inference; simple random and opportunity sampling; select or critique sampling techniques
##2 Data presentation and interpretation
2.1 Single-variable diagrams; histogram area represents frequency
2.2 Scatter diagrams and regression lines; informal correlation; correlation is not causation
2.3 Measures of central tendency and variation, including standard deviation from summary statistics
2.4 Outliers; select or critique presentation techniques; cleaning data
##3 Probability
3.1 Mutually exclusive and independent events; link to discrete and continuous distributions
##4 Statistical distributions
4.1 Simple discrete distributions including the binomial; calculate binomial probabilities
##5 Statistical hypothesis testing
5.1 Language of hypothesis testing: H₀, H₁, significance level, test statistic, 1- and 2-tail tests, critical value and region, acceptance region, p-value
5.2 Binomial hypothesis test for a proportion; interpret in context; significance level as P(wrongly rejecting H₀)
#Mechanics
##6 Quantities and units in mechanics
6.1 S.I. units for length, time and mass; derived quantities: velocity, acceleration, force, weight
##7 Kinematics
7.1 Language of kinematics: position, displacement, distance, velocity, speed, acceleration
7.2 Displacement–time and velocity–time graphs: gradients and area under the graph
7.3 Derive and use the constant acceleration (suvat) formulae in a straight line
7.4 Calculus in kinematics for motion in a straight line
##8 Forces and Newton’s laws
8.1 The concept of force; Newton’s first law
8.2 Newton’s second law in a straight line (perpendicular forces or simple 2-D vectors)
8.3 Weight and motion under gravity; g and its value in S.I. units
8.4 Newton’s third law; equilibrium of forces on a particle; smooth pulleys and connected particles
@Year 2|A-level only
#Pure
##1 Proof
1.1 Proof by contradiction, including irrationality of √2 and infinity of primes
##2 Algebra and functions
2.6 Simplify rational expressions; algebraic division by linear expressions
2.7 The modulus of a linear function
2.8 Composite functions; inverse functions and their graphs
2.9 Combinations of transformations
2.10 Partial fractions (up to squared linear denominators, three terms)
2.11 Functions in modelling; limitations and refinements
##3 Coordinate geometry in the (x, y) plane
3.3 Parametric equations; converting between Cartesian and parametric forms
3.4 Parametric equations in modelling
##4 Sequences and series
4.1 Binomial expansion for any rational n; approximations; valid for |bx/a| < 1
4.2 Sequences from an nth-term formula or xₙ₊₁ = f(xₙ); increasing, decreasing and periodic sequences
4.3 Sigma notation
4.4 Arithmetic sequences and series: nth term and sum to n terms
4.5 Geometric sequences and series; sum to infinity when |r| < 1
4.6 Sequences and series in modelling
##5 Trigonometry
5.1 Radian measure; arc length and sector area
5.2 Small angle approximations for sin, cos and tan
5.3 Exact values of sin, cos and tan for 0, π/6, π/4, π/3, π/2, π and multiples
5.4 sec, cosec, cot and arcsin, arccos, arctan: graphs, domains and ranges
5.5 sec²θ = 1 + tan²θ and cosec²θ = 1 + cot²θ
5.6 Double angle and compound angle formulae; a cos θ + b sin θ as R cos(θ ± α) or R sin(θ ± α)
5.8 Proofs involving trig functions and identities
5.9 Trig in context: vectors, kinematics and forces
##7 Differentiation
7.1 Derivatives of sin x and cos x from first principles; second derivative, convex and concave curves, points of inflection
7.2 Differentiate e^kx, a^kx, sin kx, cos kx, tan kx and ln x
7.3 Points of inflection
7.4 Product, quotient and chain rules; connected rates of change; inverse functions
7.5 Implicit and parametric differentiation (first derivative)
7.6 Construct simple differential equations, in pure maths and in context
##8 Integration
8.2 Integrate e^kx, 1/x, sin kx and cos kx
8.3 Area between two curves
8.4 Integration as the limit of a sum
8.5 Integration by substitution and by parts
8.6 Integration using partial fractions
8.7 First-order separable differential equations; particular solutions
8.8 Interpret differential equation solutions in context; limitations
##9 Numerical methods
9.1 Locate roots by change of sign; how sign-change methods fail
9.2 Iteration; cobweb and staircase diagrams
9.3 Newton–Raphson and xₙ₊₁ = g(xₙ); how these methods fail
9.4 Trapezium rule; bounds on the area
9.5 Numerical methods in context
##10 Vectors
10.1 Vectors in three dimensions
#Statistics
##3 Probability
3.2 Conditional probability: tree and Venn diagrams, two-way tables, P(A|B) = P(A∩B)/P(B)
3.3 Modelling with probability; critique assumptions
##4 Statistical distributions
4.2 The Normal distribution as a model; links to histograms, mean, s.d., points of inflection and the binomial
4.3 Select an appropriate distribution; when binomial or Normal may not fit
##5 Statistical hypothesis testing
5.1 Correlation coefficients; test using a given p-value or critical value
5.3 Hypothesis test for the mean of a Normal distribution with known variance
#Mechanics
##6 Quantities and units in mechanics
6.1 Moments as a derived quantity
##7 Kinematics
7.3 Constant acceleration in 2 dimensions using vectors
7.4 Calculus in kinematics in 2 dimensions using vectors
7.5 Motion under gravity in a vertical plane; projectiles
##8 Forces and Newton’s laws
8.2 Newton’s second law where forces need resolving (2-D)
8.4 Resolving forces in 2-D; equilibrium of a particle under coplanar forces
8.5 Addition of forces; resultants; dynamics in a plane
8.6 Friction: F ≤ μR, coefficient of friction, rough surfaces, limiting friction and statics
##9 Moments
9.1 Moments in simple static contexts
</script>

<script type="text/plain" id="d-p">
#Module 1|Development of practical skills
##1.1.1 Planning
(a) Experimental design, including solving problems in a practical context
(b) Identifying variables that must be controlled
(c) Evaluating whether a method meets the expected outcomes
##1.1.2 Implementing
(a) Using a wide range of practical apparatus and techniques correctly
(b) Appropriate units for measurements
(c) Presenting observations and data in an appropriate format
##1.1.3 Analysis
(a) Processing, analysing and interpreting qualitative and quantitative results
(b) Mathematical skills for analysing quantitative data
(c) Appropriate use of significant figures
(d) Plotting and interpreting graphs: scales, quantities, units, gradients and intercepts
##1.1.4 Evaluation
(a) Evaluating results and drawing conclusions
(b) Identifying anomalies in measurements
(c) Limitations in experimental procedures
(d) Precision and accuracy; margins of error, percentage errors and uncertainties
(e) Refining experimental design by suggesting improvements
##1.2.1 Practical skills (endorsement)
(a) Apply investigative approaches and methods to practical work
(b) Safely and correctly use practical equipment and materials
(c) Follow written instructions
(d) Make and record observations and measurements
(e) Keep appropriate records of experimental activities
(f) Present information and data in a scientific way
(g) Use software and tools to process data, research and report findings
(h) Use online and offline research skills
(i) Correctly cite sources of information
(j) Use a wide range of experimental instruments, equipment and techniques
##1.2.2 Use of apparatus and techniques
(a) Analogue apparatus for length, temperature, pressure, force, angles and volume; interpolating scales
(b) Digital instruments including multimeters for time, current, voltage, resistance and mass
(c) Increasing accuracy: timing many oscillations, fiducial marker, set square, plumb line
(d) Stopwatch or light gates for timing
(e) Calipers and micrometers (digital or vernier)
(f) Building circuits from diagrams, including polarity-sensitive components
(g) Designing, constructing and checking circuits
(h) Signal generator and oscilloscope: volts/division and time-base
(i) Generating and measuring waves: microphone and loudspeaker, ripple tank, vibration transducer or microwaves
(j) Laser or light source to investigate interference and diffraction
(k) ICT: modelling, data-loggers with sensors, data-processing software
(l) Ionising radiation, including detectors
#Module 2|Foundations of physics
##2.1.1 Physical quantities
(a) Physical quantities have a numerical value and a unit
(b) Making estimates of physical quantities
##2.1.2 S.I. units
(a) S.I. base quantities and units: kg, m, s, A, K, mol
(b) Derived units of S.I. base units
(c) Units listed in the specification
(d) Checking homogeneity of equations using S.I. base units
(e) Prefixes from pico (p) to tera (T)
(f) Conventions for labelling graph axes and table columns
##2.2.1 Measurements and uncertainties
(a) Systematic errors (including zero errors) and random errors
(b) Precision and accuracy
(c) Absolute and percentage uncertainties when combining data
(d) Error bars, line of best fit, worst line, percentage difference
##2.3.1 Scalars and vectors
(a) Scalar and vector quantities
(b) Vector addition and subtraction
